<!DOCTYPE html>
<html lang="en" data-theme="cyber-green">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jezto</title>
  <meta name="description" content="Yo, I'm Jesto. Creative developer, interface designer, and technologist building retro-future digital experiences." />
  
  <!-- Open Graph / Social -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Yo, I'm Jesto." />
  <meta property="og:description" content="Creative developer building retro-future digital experiences." />
  <meta property="og:image" content="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1200&h=630&fit=crop" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <!-- Custom Mouse Cursor dot -->
  <div id="custom-cursor" class="custom-cursor"></div>

  <!-- Background Parallax Layers -->
  <div class="bg-grid-mesh" id="bg-grid"></div>
  <div class="bg-parallax-particles" id="bg-particles"></div>

  <!-- Main Console Shell -->
  <div class="console-shell">
    
    <!-- Top Header Bar -->
    <header class="console-header">
      <div class="header-left">
        <span class="status-dot pulsing"></span>
        <span class="logo-text">JEZTO::CORE_OS_v1.0</span>
      </div>
      <div class="header-right">
        <!-- Sound Toggle -->
        <button id="sound-toggle" class="icon-btn" aria-label="Toggle Sound Effects" title="Toggle Sound FX">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sound-on-icon"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sound-off-icon hidden"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
        </button>
        
        <!-- Theme Select Dropdown -->
        <div class="theme-selector-wrapper">
          <button id="theme-btn" class="icon-btn" aria-label="Switch Theme" title="Switch Color Palette">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          </button>
          <div id="theme-menu" class="theme-menu hidden">
            <button class="theme-opt" data-val="cyber-green">Cyber Green</button>
            <button class="theme-opt" data-val="rose-gold">Rose Gold</button>
            <button class="theme-opt" data-val="monochrome">Monochrome</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Screen Viewport (CRT styling) -->
    <main class="console-screen-wrapper">
      <div class="crt-overlay"></div>
      <div class="crt-bezel-shadow"></div>
      <div class="crt-screen">
        <!-- OSD Page Counter -->
        <div class="screen-osd" id="screen-osd">PAGE: 1 / 5</div>

        <!-- Scrollable Slide Viewport -->
        <div id="slide-viewport" class="slide-viewport">
          <!-- Slides will be injected dynamically via app.js -->
          <div id="slide-content" class="slide-content">
            <!-- Loading Indicator -->
            <div class="terminal-loader">
              <span class="loader-prompt">jesto@node:~$</span> <span class="loader-cursor">█</span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Vintage Controller Board -->
    <section class="console-controls" aria-label="Console Controls">
      <div class="control-pad">
        <button id="btn-prev" class="control-btn" aria-label="Previous Slide" title="Previous (Left Arrow)">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          <span>PREV</span>
        </button>
        <button id="btn-home" class="control-btn" aria-label="Reset to First Slide" title="Home (Esc)">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span>INDEX</span>
        </button>
        <button id="btn-next" class="control-btn" aria-label="Next Slide" title="Next (Right Arrow / Space)">
          <span>NEXT</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </div>

      <div class="control-keyboard-tip">
        <span>TIP: USE <kbd class="key-badge">◀</kbd> <kbd class="key-badge">▶</kbd> KEYS OR <kbd class="key-badge">SPACE</kbd></span>
      </div>
    </section>

    <!-- Footer Bar -->
    <footer class="console-footer">
      <div class="footer-left">
        <span>SYS.OK: <span id="ping-rate">24ms</span></span>
      </div>
      <div class="footer-right">
        <span id="local-time" class="time-display">00:00:00</span>
      </div>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
